services:

  # =========================
  # DATABASES
  # =========================

  postgres-course:
    image: postgres:17
    container_name: postgres-course
    environment:
      POSTGRES_DB: course_db
      POSTGRES_USER: course_user
      POSTGRES_PASSWORD: course_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_course_data:/var/lib/postgresql/data
    networks:
      - lms-network

  postgres-user:
    image: postgres:17
    container_name: postgres-user
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    networks:
      - lms-network

  postgres-enrollment:
    image: postgres:17
    container_name: postgres-enrollment
    environment:
      POSTGRES_DB: enrollment_db
      POSTGRES_USER: enrollment_user
      POSTGRES_PASSWORD: enrollment_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_enrollment_data:/var/lib/postgresql/data
    networks:
      - lms-network

  postgres-reporting:
    image: postgres:17
    container_name: postgres-reporting
    environment:
      POSTGRES_DB: reporting_db
      POSTGRES_USER: reporting_user
      POSTGRES_PASSWORD: reporting_password
    ports:
      - "5435:5432"
    volumes:
      - postgres_reporting_data:/var/lib/postgresql/data
    networks:
      - lms-network

  # =========================
  # INFRASTRUCTURE
  # =========================

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - lms-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - lms-network

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - lms-network

  # =========================
  # MICROSERVICES
  # =========================

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      DB_URL: jdbc:postgresql://postgres-user:5432/userdb
      DB_USERNAME: postgres
      DB_PASSWORD: password
    ports:
      - "8085:8080"
    depends_on:
      - postgres-user
    networks:
      - lms-network

  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: course-service
    environment:
      DB_URL: jdbc:postgresql://postgres-course:5432/course_db
      DB_USERNAME: course_user
      DB_PASSWORD: course_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SERVER_PORT: 8082
      JWT_SECRET: mySecretKeyForJwtAuthentication123456789
    ports:
      - "8082:8082"
    depends_on:
      - postgres-course
      - kafka
      - minio
      - redis
    networks:
      - lms-network

  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile
    container_name: enrollment-service
    environment:
      DB_URL: jdbc:postgresql://postgres-enrollment:5432/enrollment_db
      DB_USERNAME: enrollment_user
      DB_PASSWORD: enrollment_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      - postgres-enrollment
    networks:
      - lms-network

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    container_name: reporting-service
    environment:
      DB_URL: jdbc:postgresql://postgres-reporting:5432/reporting_db
      DB_USERNAME: reporting_user
      DB_PASSWORD: reporting_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8086
    ports:
      - "8086:8086"
    depends_on:
      - postgres-reporting
    networks:
      - lms-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8090:8090"
    depends_on:
      - user-service
      - course-service
      - enrollment-service
      - reporting-service
    networks:
      - lms-network

# =========================
# VOLUMES
# =========================

volumes:
  postgres_course_data:
  postgres_user_data:
  postgres_enrollment_data:
  postgres_reporting_data:

# =========================
# NETWORK
# =========================

networks:
  lms-network:
    driver: bridge