spring:
  application:
    name: enrollment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enrollment_db}
    username: ${DB_USERNAME:enrollment_user}
    password: ${DB_PASSWORD:enrollment_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        spring.json.add.type.headers: false

security:
  jwt:
    secret: mySecretKeyForJwtAuthentication123456789

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always