spring:
  application:
    name: reporting-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/reporting_db}
    username: ${DB_USERNAME:reporting_user}
    password: ${DB_PASSWORD:reporting_password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

server:
  port: 8086