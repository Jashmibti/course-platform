spring:
  application:
    name: course-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/course_db}
    username: ${DB_USERNAME:course_user}
    password: ${DB_PASSWORD:course_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ============================================================
  # MULTIPART FILE UPLOAD CONFIGURATION
  # ============================================================
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  cache:
    type: ${CACHE_TYPE:simple}

server:
  port: ${SERVER_PORT:8082}

security:
  jwt:
    secret: mySecretKeyForJwtAuthentication123456789

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:course-videos}

app:
  kafka:
    topics:
      course-created: ${KAFKA_TOPIC_COURSE_CREATED:course-created}
      course-updated: ${KAFKA_TOPIC_COURSE_UPDATED:course-updated}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html