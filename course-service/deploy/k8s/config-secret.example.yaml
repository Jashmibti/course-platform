apiVersion: v1
kind: ConfigMap
metadata:
  name: course-service-config
  namespace: learning-platform
data:
  db-url: jdbc:postgresql://postgres:5432/course_db
  kafka-bootstrap-servers: kafka:9092
  minio-endpoint: http://minio:9000
---
apiVersion: v1
kind: Secret
metadata:
  name: course-service-secret
  namespace: learning-platform
type: Opaque
stringData:
  db-username: course_user
  db-password: change-me
  minio-access-key: minioadmin
  minio-secret-key: change-me
  jwt-secret: change-me-to-a-long-random-secret
